  An-Nibrās Institute: "The Journey has Started" (summit launch animation)

  CREDITS
  - Artwork and direction: Abdulgafar Quareeb. He designed the flyer and its layers
    (background, rocket, logo) and directed the layout, rocket angle, size and placement.
  - Animation code: written by Claude (AI) from Abdulgafar's brief and revisions.
  - Not exported to a video file. It plays live in the browser.

  HOW IT WORKS (short version)
  1. build() draws the stage: background, canvas, rocket, logo, headline, text and end card.
  2. Text and the end card are animated with CSS keyframes. Each word has its own delay.
  3. A JavaScript loop (requestAnimationFrame) runs about 60 times a second. Each frame it
     moves the rocket, then spawns and draws light streaks and smoke puffs on a <canvas>.
  4. The numbers you can tweak are in CFG (timings, handle, text) and in play() (angle, speeds).
-->

// words(): splits a sentence into separate words so each one can pop in with its own delay.
function words(t,cls,start,step){
  return t.split(' ').map(function(w,i){return '<span class="w '+cls+'" style="animation-delay:'+(start+i*step).toFixed(2)+'s">'+w+'</span>'}).join('');
}
// build(): creates every element on the stage (background, canvas, rocket, logo, text, end card).
function build(){
  stage.innerHTML=
   '<div class="bg"></div><div class="rays"></div><canvas id="cv"></canvas>'+
   '<div class="rk" id="rk"><img class="r" alt="Rocket" src="'+IMG.rocket+'"><img class="emb" alt="" src="'+IMG.mark+'"></div>'+
   '<img class="logo" alt="An-Nibrās Institute" src="'+IMG.logo+'">'+
   '<div class="hd"><div class="hl">'+words('The Journey','h o',1,.2)+'</div><div class="hl">'+words('has Started!','h c',1.9,.2)+'</div>'+
   '<div class="live"><span class="dot"></span>'+words('We are now live.','',4.5,.16)+'</div>'+
   '<div style="margin-top:8.2cqw"><div class="p" style="animation-delay:5.5s">'+CFG.line1+'</div><div class="p" style="animation-delay:5.9s">'+CFG.line2+'</div><div class="p" style="animation-delay:6.3s">'+CFG.line3+'</div></div></div>'+
   '<div class="pill"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 2h10l-2 10H1z" fill="#7af0d6"/></svg>'+CFG.handle+'</div>'+
   '<div class="endc"><div class="el">THE DESIGN</div><img class="fly" alt="Original flyer design" src="'+IMG.flyer+'"><div class="ec">Designed by '+CFG.designer+'</div></div>'+
   '<div id="bar"></div>';
}
// play(): starts (or restarts) the whole animation. Replay calls this too.
function play(){
  cancelAnimationFrame(raf);build();
  var cv=document.getElementById('cv'),rk=document.getElementById('rk'),bar=document.getElementById('bar'),ctx=cv.getContext('2d');
  var W=stage.clientWidth,H=stage.clientHeight,dpr=window.devicePixelRatio||1,cq=W/100;
  cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
  // DX, DY = direction the rocket points (towards its nose). ANG = how far the rocket image is rotated, in degrees.
  var DX=0.779,DY=-0.630,ANG=17.5;            // rocket axis (towards the nose)
  var streaks=[],puffs=[],t0=performance.now(),last=t0;
  function rnd(a,b){return a+Math.random()*(b-a)}
  function tail(){var r=rk.getBoundingClientRect(),s=stage.getBoundingClientRect();
    var k=rk.offsetWidth/820;return {x:r.left-s.left+r.width/2-324*k,y:r.top-s.top+r.height/2+296*k}}
  // spawn(): creates n new light streaks at the rocket's exhaust. "heavy" = more and longer streaks during launch.
  function spawn(n,heavy){
    var o=tail();
    for(var i=0;i<n;i++){
      var side=rnd(-1,1),px=-DY,py=DX;                // perpendicular to the axis
      streaks.push({x:o.x+px*side*13*cq+rnd(-2,2)*cq,y:o.y+py*side*13*cq+rnd(-2,2)*cq,
        len:rnd(10,heavy?34:22)*cq,sp:rnd(60,heavy?170:110)*cq,w:rnd(.15,.5)*cq,life:rnd(.5,1.1),age:0});
    }
  }
  // frame(): runs every animation frame. Moves the rocket, adds particles, then redraws the smoke and streaks.
  function frame(now){
    var dt=Math.min((now-last)/1000,.05);last=now;var t=(now-t0)/1000;
    bar.style.width=Math.min(t/CFG.total,1)*100+'%';
    // rocket: launches in from bottom-left along its own axis, then hovers
    var p=Math.min(Math.max((t-CFG.launchAt)/CFG.launchTime,0),1),e=1-Math.pow(1-p,3);
    var d=(1-e)*110*cq,bob=p>=1?Math.sin((t-CFG.launchAt-CFG.launchTime)*2.2)*.9*cq:0;
    rk.style.opacity=t<CFG.launchAt?0:1;
    rk.style.transform='translate('+(-d*DX+bob*DX)+'px,'+(-d*DY-bob*DY*-1)+'px) rotate('+ANG+'deg)';
    // particles: heavy during launch, ambient afterwards
    if(t>=CFG.launchAt){
      var launching=p<1;
      spawn(launching?7:2,launching);
      if(Math.random()<(launching?.9:.25))puffs.push({x:tail().x+rnd(-3,3)*cq,y:tail().y+rnd(-3,3)*cq,r:rnd(3,6)*cq,g:rnd(8,16)*cq,a:rnd(.16,.3),age:0,life:rnd(1,1.8)});
    }
    ctx.clearRect(0,0,W,H);ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
    puffs=puffs.filter(function(q){q.age+=dt;return q.age<q.life});
    puffs.forEach(function(q){
      var k=q.age/q.life;q.x-=DX*22*cq*dt;q.y+=-DY*22*cq*dt;
      var rr=q.r+q.g*k,g=ctx.createRadialGradient(q.x,q.y,0,q.x,q.y,rr);
      g.addColorStop(0,'rgba(215,255,250,'+(q.a*(1-k))+')');g.addColorStop(1,'rgba(215,255,250,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(q.x,q.y,rr,0,6.283);ctx.fill();
    });
    streaks=streaks.filter(function(s){s.age+=dt;return s.age<s.life});
    streaks.forEach(function(s){
      s.x-=DX*s.sp*dt;s.y+=-DY*s.sp*dt;
      var a=(1-s.age/s.life)*.8,x2=s.x+DX*s.len,y2=s.y+DY*s.len,g=ctx.createLinearGradient(s.x,s.y,x2,y2);
      g.addColorStop(0,'rgba(190,255,245,0)');g.addColorStop(1,'rgba(235,255,252,'+a+')');
      ctx.strokeStyle=g;ctx.lineWidth=s.w;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(x2,y2);ctx.stroke();
    });
    raf=requestAnimationFrame(frame);
  }
  raf=requestAnimationFrame(frame);
}
document.getElementById('replay').addEventListener('click',play);
window.addEventListener('resize',function(){});
play();
</script>
</body>
</html>
